server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/attendance_db?useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=utf8mb4
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: your-256-bit-secret-key-for-attendance-system-replace-in-production
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

spring.mail:
  host: smtp.gmail.com
  port: 587
  username:
  password:
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true

logging:
  level:
    com.attendance: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
